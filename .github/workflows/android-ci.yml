name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static analysis and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is not in the repo (.gitignore); the Google
      # Services Gradle plugin needs it to build, so it comes from a secret.
      - name: Provide google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Missing repository secret GOOGLE_SERVICES_JSON"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # --continue runs every check even if one fails, so a single run shows all problems
      - name: detekt, Android Lint and unit tests
        run: ./gradlew detekt lintDebug testDebugUnitTest --continue --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/detekt
            app/build/reports/lint-results*
            app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
